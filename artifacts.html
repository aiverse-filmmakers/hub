<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Tools | AI-Verse Filmmakers</title>
  <meta name="description" content="AI-Verse Filmmakers member tools and browser artifacts." />
  <style>
    :root {
      --page: #f5f5f7;
      --ink: #1d1d1f;
      --muted: rgba(29,29,31,.66);
      --blue: #0071e3;
      --line: rgba(29,29,31,.12);
      --card: #ffffff;
      --shadow: 0 18px 70px rgba(0,0,0,.1);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 52px;
      display: flex;
      justify-content: center;
      background: rgba(245,245,247,.72);
      backdrop-filter: saturate(180%) blur(22px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner { width: min(1080px, calc(100% - 28px)); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 760; white-space: nowrap; }
    .nav-links { display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--muted); }
    .nav-links a:hover { color: var(--ink); }
    .nav-cta { min-height: 34px; display: inline-flex; align-items: center; border-radius: 999px; padding: 0 14px; background: var(--ink); color: #fff; font-weight: 700; }
    main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 88px 0 72px; }
    .hero { max-width: 760px; margin-bottom: 44px; }
    .kicker { margin: 0 0 12px; color: var(--blue); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 760; }
    h1 { margin: 0 0 16px; font-size: clamp(48px, 8vw, 96px); line-height: .9; letter-spacing: -.07em; }
    .lead { margin: 0; color: var(--muted); font-size: clamp(19px, 2.2vw, 27px); line-height: 1.18; letter-spacing: -.035em; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    .card {
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-radius: 28px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 24px 86px rgba(0,0,0,.14); }
    .card-name { font-size: 26px; line-height: 1; letter-spacing: -.04em; font-weight: 760; }

    .placeholder, .loading { color: var(--muted); padding: 32px; border-radius: 28px; background: #fff; border: 1px solid var(--line); }
    footer { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 44px; border-top: 1px solid var(--line); color: var(--muted); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; }
    footer a { text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 620px) { .nav-cta { display: none; } main { padding-top: 62px; } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <nav class="nav" aria-label="Member tools navigation">
    <div class="nav-inner">
      <a href="./" class="brand">AI-Verse Filmmakers</a>
      <div class="nav-links">
        <a href="./">Home</a>
        <a href="./artifacts.html">Member tools</a>
        <a href="./camera-movements/">Camera movements</a>
        <a class="nav-cta" href="https://www.skool.com/bogdans-ai-verse-4398/about">Join AI-Verse</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero">
      <p class="kicker">Member tools</p>
      <h1>AI-Verse browser tools.</h1>
      <p class="lead">Practical browser tools for planning, creating and finishing stronger AI films.</p>
    </section>
    <section class="grid" id="grid" aria-live="polite">
      <div class="loading">Loading member tools...</div>
    </section>
  </main>

  <footer>
    <div>© 2026 AI-Verse Filmmakers</div>
    <div><a href="./">Back to homepage</a></div>
  </footer>

  <script>
    (async function() {
      const grid = document.getElementById('grid');
      const api = 'https://api.github.com/repos/aiverse-filmmakers/hub/contents/';
      const excluded = new Set(['assets', 'artifacts', '.github', 'portfolio-builder']);

      try {
        const res = await fetch(api);
        if (!res.ok) throw new Error('Failed to fetch tools');
        const items = await res.json();
        const dirs = items.filter(item => item.type === 'dir' && !excluded.has(item.name));

        if (dirs.length === 0) {
          grid.innerHTML = '<div class="placeholder">More member tools coming soon.</div>';
          return;
        }

        grid.innerHTML = '';
        dirs.forEach(dir => {
          const name = dir.name
            .replace(/-/g, ' ')
            .replace(/_/g, ' ')
            .replace(/\b\w/g, c => c.toUpperCase());

          const card = document.createElement('a');
          card.className = 'card';
          card.href = `./${dir.name}/`;

          const top = document.createElement('div');
          const label = document.createElement('p');
          label.className = 'kicker';
          label.textContent = 'Tool';
          const title = document.createElement('div');
          title.className = 'card-name';
          title.textContent = name;
          top.append(label, title);

          card.append(top);
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '<div class="placeholder">More member tools coming soon.</div>';
      }
    })();
  </script>
</body>
</html>
