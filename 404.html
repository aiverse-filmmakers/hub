<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — AI-Verse Filmmakers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07090e;
    --primary: #ffffff;
    --secondary: #4cb9d5;
    --body: #e4e8ed;
  }

  body {
    background: var(--bg);
    color: var(--body);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: 6rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
  }

  p {
    font-size: 1.2rem;
    color: rgba(228, 232, 237, 0.6);
    margin: 1rem 0 2rem;
  }

  a {
    color: var(--secondary);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.05rem;
    transition: color 0.2s;
  }

  a:hover {
    color: #3da8c4;
  }
</style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found.</p>
  <a href="./">Back Home</a>
</body>
</html>
