<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Compare every original first frame with its live-action realism frame.">
  <meta name="theme-color" id="themeColor" content="#000000">
  <title>Animation to Realism Studio | AI-Verse Filmmakers</title>
  <script>
    (()=>{const t=localStorage.getItem('a2r-theme')||'dark';document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t})();
  </script>
  <style>
    :root,html[data-theme="light"]{color-scheme:light;--bg:#fff;--surface:#f5f5f7;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(29,29,31,.14);--accent:#0071e3;--nav:rgba(255,255,255,.9)}
    html[data-theme="dark"]{color-scheme:dark;--bg:#000;--surface:#111;--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.16);--accent:#2997ff;--nav:rgba(0,0,0,.9)}
    *{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    .topbar{position:sticky;top:0;z-index:20;height:58px;border-bottom:1px solid var(--line);background:var(--nav);backdrop-filter:saturate(180%) blur(20px)}.top-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(16px,4vw,42px)}.brand{font-size:12px;font-weight:780;letter-spacing:.13em}.theme{width:54px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}.track{position:relative;width:46px;height:28px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}.thumb{position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--text);color:var(--bg);transition:transform .2s}html[data-theme="dark"] .thumb{transform:translateX(18px)}
    main{width:min(1500px,100%);margin:0 auto;padding:clamp(38px,7vw,90px) clamp(14px,3.5vw,52px) 100px}.eyebrow{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:760;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;max-width:1100px;font-size:clamp(38px,6vw,78px);line-height:.96;letter-spacing:-.065em}.lead{margin:18px 0 0;color:var(--muted);font-size:clamp(17px,2vw,23px)}.count{margin:10px 0 0;color:var(--muted);font-size:14px}
    .shots{display:grid;gap:clamp(28px,5vw,70px);margin-top:clamp(44px,7vw,96px)}.shot{scroll-margin-top:78px}.shot h2{margin:0 0 14px;font-size:clamp(24px,3vw,38px);letter-spacing:-.045em}.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.3vw,18px)}.frame{min-width:0}.label{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;color:var(--muted);font-size:13px}.image-button{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line);background:#000;cursor:zoom-in;overflow:hidden}.image-button img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000}.image-button::after{content:"View full screen";position:absolute;right:10px;bottom:10px;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;opacity:0;transform:translateY(4px);transition:.18s}.image-button:hover::after,.image-button:focus-visible::after{opacity:1;transform:none}.missing{display:grid;place-items:center;aspect-ratio:16/9;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
    dialog{width:100vw;max-width:none;height:100vh;max-height:none;margin:0;padding:0;border:0;background:#000;color:#fff}dialog::backdrop{background:#000}.viewer{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:56px 10px 12px}.viewer img{display:block;max-width:100%;max-height:calc(100vh - 72px);width:auto;height:auto;object-fit:contain}.viewer-bar{position:absolute;top:0;left:0;right:0;z-index:2;height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 max(14px,env(safe-area-inset-left));background:rgba(0,0,0,.72);backdrop-filter:blur(16px)}.viewer-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.close{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
    .error{margin-top:40px;padding:18px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
    @media(max-width:640px){.topbar{height:54px}.brand{font-size:10px}.top-inner{padding:0 12px}main{padding:34px 10px 70px}.shots{gap:38px;margin-top:48px}.shot h2{margin-left:2px}.pair{gap:6px}.label{display:block;margin-left:2px;font-size:11px}.label span:last-child{display:none}.image-button::after{display:none}.image-button img{aspect-ratio:16/9}.viewer{padding:54px 0 0}.viewer img{max-height:calc(100vh - 54px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner"><a class="brand" href="../">AI-VERSE FILMMAKERS</a><button class="theme" id="themeSwitch" type="button" role="switch" aria-checked="true" aria-label="Switch to light mode"><span class="track"><span class="thumb" id="themeIcon">☾</span></span></button></div></header>
  <main>
    <p class="eyebrow">Animation to Realism</p>
    <h1 id="projectTitle">Loading project…</h1>
    <p class="lead">Original first frame and realism first frame.</p>
    <p class="count" id="shotCount"></p>
    <section class="shots" id="shotGrid" aria-live="polite"></section>
    <div class="error" id="error" hidden>The project images could not be loaded. Refresh the page and try again.</div>
  </main>
  <dialog id="viewer" aria-labelledby="viewerTitle">
    <div class="viewer">
      <div class="viewer-bar"><span class="viewer-title" id="viewerTitle"></span><button class="close" id="closeViewer" type="button" aria-label="Close full-screen image">×</button></div>
      <img id="viewerImage" alt="">
    </div>
  </dialog>
  <script>
    const $=s=>document.querySelector(s);
    function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function setTheme(t){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;localStorage.setItem('a2r-theme',t);$('#themeColor').content=t==='dark'?'#000000':'#ffffff';$('#themeSwitch').setAttribute('aria-checked',String(t==='dark'));$('#themeSwitch').setAttribute('aria-label',`Switch to ${t==='dark'?'light':'dark'} mode`);$('#themeIcon').textContent=t==='dark'?'☾':'☀';}
    $('#themeSwitch').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));setTheme(document.documentElement.dataset.theme||'dark');
    function imageButton(src,label,alt){return src?`<button class="image-button" type="button" data-full="${esc(src)}" data-label="${esc(label)}" aria-label="Open ${esc(label)} full screen"><img src="${esc(src)}" alt="${esc(alt)}"></button>`:`<div class="missing">Not generated</div>`;}
    function shotCard(s,index){const n=index+1;const original=`Shot ${n} · Original first frame`;const realism=`Shot ${n} · Realism first frame`;return `<article class="shot" id="shot-${n}"><h2>Shot ${n}</h2><div class="pair"><div class="frame"><div class="label"><strong>Original first frame</strong><span>F${esc(s.seed_frame)}</span></div>${imageButton(s.poster,original,original)}</div><div class="frame"><div class="label"><strong>Realism first frame</strong></div>${imageButton(s.realism,realism,realism)}</div></div></article>`;}
    const viewer=$('#viewer'),viewerImage=$('#viewerImage'),viewerTitle=$('#viewerTitle');
    function openViewer(button){viewerImage.src=button.dataset.full;viewerImage.alt=button.dataset.label;viewerTitle.textContent=button.dataset.label;viewer.showModal();document.body.style.overflow='hidden';if(viewer.requestFullscreen) viewer.requestFullscreen().catch(()=>{});}
    function closeViewer(){if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});viewer.close();document.body.style.overflow='';viewerImage.removeAttribute('src');}
    $('#closeViewer').addEventListener('click',closeViewer);viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});viewer.addEventListener('cancel',e=>{e.preventDefault();closeViewer()});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&viewer.open){viewer.close();document.body.style.overflow='';viewerImage.removeAttribute('src')}});
    // shots.json is generated from the verified local manifest. Dynamic values are escaped before this controlled markup is inserted.
    async function load(){const d=await fetch('data/shots.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});$('#projectTitle').textContent=d.project_label;document.title=`${d.project_label} | Animation to Realism Studio`;$('#shotCount').textContent=`${d.shot_count} shots · all visible`;$('#shotGrid').innerHTML=d.shots.map(shotCard).join('');document.querySelectorAll('.image-button').forEach(b=>b.addEventListener('click',()=>openViewer(b)));}
    load().catch(err=>{$('#error').hidden=false;console.error(err)});
  </script>
</body>
</html>
