<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Verse Filmmakers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07090e;
    --primary: #ffffff;
    --secondary: #4cb9d5;
    --accent: #a9dcea;
    --orange: #d4782a;
    --body: #e4e8ed;
  }

  body {
    background: var(--bg);
    color: var(--body);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Navbar */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 2rem;
    background: var(--bg);
    border-bottom: 1px solid rgba(76, 185, 213, 0.4);
    backdrop-filter: blur(12px);
  }

  .nav-logo {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--primary);
    text-decoration: none;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    color: var(--body);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: var(--secondary);
  }

  /* Hero */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(76, 185, 213, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero h1 {
    font-size: clamp(2.2rem, 6vw, 4.5rem);
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.02em;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }

  .hero .subtext {
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-weight: 400;
    color: var(--orange);
    margin-top: 1rem;
    position: relative;
    z-index: 1;
    text-shadow: 0 0 40px rgba(212, 120, 42, 0.4), 0 0 80px rgba(212, 120, 42, 0.2);
  }

  .cta-btn {
    display: inline-block;
    margin-top: 2.5rem;
    padding: 0.95rem 2.8rem;
    background: var(--secondary);
    color: var(--primary);
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 999px;
    text-decoration: none;
    transition: all 0.25s;
    position: relative;
    z-index: 1;
    letter-spacing: 0.03em;
  }

  .cta-btn:hover {
    background: #3da8c4;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(76, 185, 213, 0.35);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .navbar {
      padding: 1rem 1.25rem;
    }
    .nav-links {
      gap: 1.25rem;
    }
    .nav-links a {
      font-size: 0.85rem;
    }
    .hero {
      padding: 1rem;
    }
    .cta-btn {
      padding: 0.85rem 2.2rem;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">AI-VERSE</a>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/artifacts">Artifacts</a></li>
    <li><a href="https://www.skool.com/bogdans-ai-verse-4398/about" target="_blank">About</a></li>
  </ul>
</nav>

<section class="hero">
  <h1>JOIN AI-VERSE<br>FILMMAKERS</h1>
  <p class="subtext">The Only AI Filmmaker Skool Made by Filmmakers.</p>
  <a href="https://www.skool.com/bogdans-ai-verse-4398/about" target="_blank" class="cta-btn">JOIN THE AI-VERSE</a>
</section>

</body>
</html>
